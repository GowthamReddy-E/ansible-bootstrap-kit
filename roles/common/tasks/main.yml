---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname_short }}"
  when: manage_hostname | default(true)

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  register: common_pkg_install
  until: common_pkg_install is succeeded
  retries: 3
  delay: 5

- name: Deploy MOTD banner
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
