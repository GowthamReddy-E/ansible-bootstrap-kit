---
# ---------------------------------------------------------------------------
# Pinned tool versions - the ONLY place to edit when bumping a version.
# Everything that needs the version (package names, download URLs) derives
# from these two variables instead of repeating the number elsewhere.
# ---------------------------------------------------------------------------
devtools_java_version: "17"
devtools_gradle_version: "8.10.2"
# Pinned to the latest stable Docker Engine release as of 2026-10-31.
# Only pins docker-ce/docker-ce-cli - containerd.io and docker-compose-plugin
# are released on their own independent version numbers, not in lockstep
# with docker-ce, so they deliberately stay unpinned regardless of this.
#
# CAVEAT: this must exactly match the version string in your distro's repo,
# which on apt (Debian/Ubuntu) usually includes an epoch + distro suffix
# (e.g. "5:29.9.2-1~ubuntu.24.04~noble"), not just "29.9.2" - check with
# `apt-cache madison docker-ce` and adjust this value if the install fails.
# dnf (RHEL family) is more forgiving of a bare "name-version" match.
# Set to "" to go back to always-latest instead of a fixed pin.
devtools_docker_version: "29.9.2"

devtools_install_git: true
devtools_install_git_lfs: true
devtools_install_make: true

devtools_install_java: true

devtools_install_maven: true

devtools_install_gradle: true
devtools_gradle_install_root: /opt/gradle

devtools_install_docker: true
devtools_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
# Users to add to the `docker` group (so they can run docker without sudo).
devtools_docker_users: []
